<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Between</title>
<!--

  Source: https://github.com/Raforawesome/between-wgpu
-->
<link rel="license" href="https://github.com/Raforawesome/between-wgpu/blob/master/LICENSE">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #070908; }
  body {
    color: #C9D0CB;
    font: 13px/1.5 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
  .overlay {
    position: fixed; inset: 0; display: grid; place-items: center;
    padding: 24px; box-sizing: border-box; text-align: center;
    pointer-events: none;
  }
  .card {
    max-width: 44ch; padding: 14px 18px;
    background: rgba(7, 9, 8, 0.82); border: 1px solid #2A332F;
  }
  .card p { margin: 0; }
  .card p + p { margin-top: 6px; color: #9AA6A0; }
  #stats {
    position: fixed; left: 0; right: 0; bottom: 0; margin: 0; padding: 6px 10px;
    background: rgba(7, 9, 8, 0.7); color: #9AA6A0; font-size: 12px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none;
  }
  /* state: loading → ready (→ locked while flying) | error */
  #hint, #stats { display: none; }
  body[data-state="ready"] #hint, body[data-state="ready"] #stats { display: grid; }
  body[data-state="ready"] #stats { display: block; }
  body[data-state="ready"] #status-wrap { display: none; }
  body.locked #hint, body.touched #hint { display: none; }
</style>
</head>
<body data-state="loading">
  <canvas id="between" tabindex="0" aria-label="Voxel terrain rendered by Between"></canvas>

  <div class="overlay" id="status-wrap">
    <div class="card"><p id="status" role="status">Starting WebGPU…</p></div>
  </div>

  <div class="overlay" id="hint">
    <div class="card">
      <p>Click to fly, or drag to look around</p>
      <p>Mouse to look · WASD to move · E / Q up and down · Shift to sprint · C culling · Esc to let go</p>
    </div>
  </div>

  <p id="stats"></p>

  <script type="module">
    document.addEventListener('pointerlockchange', () => {
      document.body.classList.toggle('locked', !!document.pointerLockElement);
    });
    document.getElementById('between').addEventListener('pointerdown', () => {
      document.body.classList.add('touched');
    }, { once: true });
    const status = document.getElementById('status');
    if (!('gpu' in navigator)) {
      status.textContent = 'This browser doesn’t support WebGPU, so the engine can’t run here. Try a recent Chrome, Edge or Safari.';
      document.body.dataset.state = 'error';
    } else {
      try {
        const { default: init } = await import('./between_web.js');
        await init();
      } catch (e) {
        console.error(e);
        status.textContent = 'The engine failed to start. Details are in the browser console.';
        document.body.dataset.state = 'error';
      }
    }
  </script>
</body>
</html>
