[package]
name = "between-web"
version = "0.1.0"
edition = "2024"
description = "Browser (WebGPU) build of the Between voxel engine"
license = "GPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
between-wgpu = { path = ".." }
winit = "0.30.13"
log = "0.4"
console_log = "1"
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "Window",
  "Document",
  "Element",
  "HtmlCanvasElement",
  "Performance",
  "Location",
  "UrlSearchParams",
] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
